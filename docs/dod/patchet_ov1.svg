<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">

  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e3a5f"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c9302c"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32"/>
    </marker>
    <linearGradient id="idp-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c5282"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1400" height="900" fill="#f7f8fa"/>

  <!-- ============ TITLE BANNER ============ -->
  <rect x="0" y="0" width="1400" height="105" fill="#1e3a5f"/>
  <text x="700" y="42" fill="#ffffff" font-size="26" font-weight="700" text-anchor="middle">
    PATCHET · Agent-Aware Identity for Mission Systems
  </text>
  <text x="700" y="68" fill="#9bb1cc" font-size="12" text-anchor="middle" font-weight="600" letter-spacing="3">
    OV-1 · OPERATIONAL CONCEPT GRAPHIC
  </text>
  <text x="700" y="90" fill="#cfd8e3" font-size="13" text-anchor="middle" font-style="italic">
    Mission: Secure agent-to-agent operations across federated mission systems
  </text>

  <!-- ============ THREAT VECTORS ROW ============ -->
  <text x="700" y="135" fill="#1e3a5f" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="3">
    DOCUMENTED ATTACK VECTORS — BLOCKED AT THE IDP LAYER
  </text>

  <!-- Threat 1: Identity Substitution -->
  <g transform="translate(60, 150)">
    <rect width="400" height="78" fill="#fff5f5" stroke="#d9534f" stroke-width="2" rx="6"/>
    <text x="20" y="24" font-size="22">⚠</text>
    <text x="50" y="24" fill="#c9302c" font-size="14" font-weight="700">IDENTITY SUBSTITUTION</text>
    <text x="50" y="42" fill="#666" font-size="11">Real-world pattern: SolarWinds (Dec 2020)</text>
    <text x="50" y="58" fill="#444" font-size="10.5">Malicious code with valid identity → trusted</text>
    <text x="50" y="72" fill="#444" font-size="10.5">across 18,000+ downstream systems.</text>
  </g>

  <!-- Threat 2: Privilege Escalation -->
  <g transform="translate(500, 150)">
    <rect width="400" height="78" fill="#fff5f5" stroke="#d9534f" stroke-width="2" rx="6"/>
    <text x="20" y="24" font-size="22">⚠</text>
    <text x="50" y="24" fill="#c9302c" font-size="14" font-weight="700">PRIVILEGE ESCALATION</text>
    <text x="50" y="42" fill="#666" font-size="11">Real-world pattern: Uber (Sep 2022)</text>
    <text x="50" y="58" fill="#444" font-size="10.5">Valid credentials, wrong workflow step →</text>
    <text x="50" y="72" fill="#444" font-size="10.5">unauthorized high-privilege operation.</text>
  </g>

  <!-- Threat 3: Token Replay -->
  <g transform="translate(940, 150)">
    <rect width="400" height="78" fill="#fff5f5" stroke="#d9534f" stroke-width="2" rx="6"/>
    <text x="20" y="24" font-size="22">⚠</text>
    <text x="50" y="24" fill="#c9302c" font-size="14" font-weight="700">TOKEN REPLAY</text>
    <text x="50" y="42" fill="#666" font-size="11">Real-world pattern: Okta (Oct 2023)</text>
    <text x="50" y="58" fill="#444" font-size="10.5">Stolen bearer token replayed by attacker →</text>
    <text x="50" y="72" fill="#444" font-size="10.5">accepted by all RFC-6750 endpoints.</text>
  </g>

  <!-- ============ MAIN OPERATIONAL DIAGRAM ============ -->

  <!-- LEFT COLUMN: Operating Environment (Agents) -->
  <g transform="translate(60, 260)">
    <rect width="320" height="430" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.5" rx="8"/>
    <rect width="320" height="40" fill="#1e3a5f" rx="8"/>
    <rect y="32" width="320" height="8" fill="#1e3a5f"/>
    <text x="160" y="26" fill="white" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="2">
      OPERATING ENVIRONMENT
    </text>

    <text x="160" y="62" fill="#1e3a5f" font-size="11" font-weight="600" text-anchor="middle">
      Agent populations carrying out mission operations
    </text>

    <!-- Agent boxes -->
    <g transform="translate(20, 85)">
      <rect width="280" height="46" fill="#e8f0fb" stroke="#4a90e2" stroke-width="1.5" rx="4"/>
      <circle cx="25" cy="23" r="13" fill="#4a90e2"/>
      <text x="25" y="28" fill="white" font-size="13" font-weight="700" text-anchor="middle">S</text>
      <text x="48" y="22" fill="#1e3a5f" font-size="12" font-weight="700">Supervisor agents</text>
      <text x="48" y="38" fill="#555" font-size="10">Orchestrate multi-step workflows</text>
    </g>

    <g transform="translate(20, 140)">
      <rect width="280" height="46" fill="#e8f0fb" stroke="#4a90e2" stroke-width="1.5" rx="4"/>
      <circle cx="25" cy="23" r="13" fill="#4a90e2"/>
      <text x="25" y="28" fill="white" font-size="13" font-weight="700" text-anchor="middle">P</text>
      <text x="48" y="22" fill="#1e3a5f" font-size="12" font-weight="700">Planner agents</text>
      <text x="48" y="38" fill="#555" font-size="10">Read-scope: analysis &amp; classification</text>
    </g>

    <g transform="translate(20, 195)">
      <rect width="280" height="46" fill="#e8f0fb" stroke="#4a90e2" stroke-width="1.5" rx="4"/>
      <circle cx="25" cy="23" r="13" fill="#4a90e2"/>
      <text x="25" y="28" fill="white" font-size="13" font-weight="700" text-anchor="middle">X</text>
      <text x="48" y="22" fill="#1e3a5f" font-size="12" font-weight="700">Execution agents (Patcher)</text>
      <text x="48" y="38" fill="#555" font-size="10">Write-scope: state-changing actions</text>
    </g>

    <g transform="translate(20, 250)">
      <rect width="280" height="46" fill="#e8f0fb" stroke="#4a90e2" stroke-width="1.5" rx="4"/>
      <circle cx="25" cy="23" r="13" fill="#4a90e2"/>
      <text x="25" y="28" fill="white" font-size="13" font-weight="700" text-anchor="middle">C</text>
      <text x="48" y="22" fill="#1e3a5f" font-size="12" font-weight="700">Classifier &amp; specialty agents</text>
      <text x="48" y="38" fill="#555" font-size="10">Domain-specific reasoning</text>
    </g>

    <!-- Caption box -->
    <g transform="translate(20, 320)">
      <rect width="280" height="92" fill="#f8f9fa" stroke="#cfd8e3" stroke-width="1" rx="4"/>
      <text x="14" y="22" fill="#1e3a5f" font-size="11" font-weight="700">REGISTRATION-FIRST</text>
      <text x="14" y="42" fill="#444" font-size="10.5">Each agent registers a code-checksum</text>
      <text x="14" y="56" fill="#444" font-size="10.5">identity and a Proof-of-Possession</text>
      <text x="14" y="70" fill="#444" font-size="10.5">keypair before it can act.</text>
      <text x="14" y="86" fill="#888" font-size="10" font-style="italic">No registration → no operations.</text>
    </g>
  </g>

  <!-- CENTER COLUMN: Patchet IDP -->
  <g transform="translate(420, 260)">
    <rect width="560" height="430" fill="url(#idp-grad)" stroke="#0d2647" stroke-width="2" rx="8"/>
    <text x="280" y="32" fill="white" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="2">
      PATCHET — AGENT-AWARE IDP
    </text>
    <text x="280" y="52" fill="#a0b3c8" font-size="11" text-anchor="middle" font-style="italic">
      draft-goswami-agentic-jwt-00
    </text>

    <!-- Anchor A2 -->
    <g transform="translate(30, 80)">
      <rect width="500" height="92" fill="#ffffff" stroke="#4a90e2" stroke-width="1.5" rx="6"/>
      <rect width="80" height="92" fill="#4a90e2" rx="6"/>
      <text x="40" y="44" fill="white" font-size="22" font-weight="700" text-anchor="middle">A2</text>
      <text x="40" y="68" fill="white" font-size="9" text-anchor="middle" letter-spacing="1">REGISTRATION</text>
      <text x="40" y="80" fill="white" font-size="9" text-anchor="middle" letter-spacing="1">FIRST</text>

      <text x="100" y="28" fill="#1e3a5f" font-size="13" font-weight="700">Code-Checksum Identity Binding</text>
      <text x="100" y="48" fill="#444" font-size="11">Two principals cannot share a checksum.</text>
      <text x="100" y="64" fill="#444" font-size="11">Impersonation rejected at registration —</text>
      <text x="100" y="80" fill="#2e7d32" font-size="11" font-weight="600">before any code executes.</text>
    </g>

    <!-- Anchor A8 -->
    <g transform="translate(30, 188)">
      <rect width="500" height="92" fill="#ffffff" stroke="#4a90e2" stroke-width="1.5" rx="6"/>
      <rect width="80" height="92" fill="#4a90e2" rx="6"/>
      <text x="40" y="44" fill="white" font-size="22" font-weight="700" text-anchor="middle">A8</text>
      <text x="40" y="68" fill="white" font-size="9" text-anchor="middle" letter-spacing="1">WORKFLOW</text>
      <text x="40" y="80" fill="white" font-size="9" text-anchor="middle" letter-spacing="1">BINDING</text>

      <text x="100" y="28" fill="#1e3a5f" font-size="13" font-weight="700">Step-Authorized Tokens</text>
      <text x="100" y="48" fill="#444" font-size="11">Tokens bound to (agent, checksum, workflow,</text>
      <text x="100" y="64" fill="#444" font-size="11">step). Out-of-step calls rejected at mint —</text>
      <text x="100" y="80" fill="#2e7d32" font-size="11" font-weight="600">valid scope is not enough.</text>
    </g>

    <!-- Anchor A6 -->
    <g transform="translate(30, 296)">
      <rect width="500" height="92" fill="#ffffff" stroke="#4a90e2" stroke-width="1.5" rx="6"/>
      <rect width="80" height="92" fill="#4a90e2" rx="6"/>
      <text x="40" y="44" fill="white" font-size="22" font-weight="700" text-anchor="middle">A6</text>
      <text x="40" y="68" fill="white" font-size="9" text-anchor="middle" letter-spacing="1">PROOF OF</text>
      <text x="40" y="80" fill="white" font-size="9" text-anchor="middle" letter-spacing="1">POSSESSION</text>

      <text x="100" y="28" fill="#1e3a5f" font-size="13" font-weight="700">Per-Request Cryptographic Binding</text>
      <text x="100" y="48" fill="#444" font-size="11">Every request signed with the agent's PoP</text>
      <text x="100" y="64" fill="#444" font-size="11">private key. Stolen tokens are useless —</text>
      <text x="100" y="80" fill="#2e7d32" font-size="11" font-weight="600">bearer semantics eliminated.</text>
    </g>

    <text x="280" y="412" fill="#a0b3c8" font-size="10" text-anchor="middle" font-style="italic">
      Three primitives. Three breach mechanisms blocked. STRIDE-extended T1, T2, T7.
    </text>
  </g>

  <!-- RIGHT COLUMN: Mission Resources -->
  <g transform="translate(1020, 260)">
    <rect width="320" height="430" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.5" rx="8"/>
    <rect width="320" height="40" fill="#1e3a5f" rx="8"/>
    <rect y="32" width="320" height="8" fill="#1e3a5f"/>
    <text x="160" y="26" fill="white" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="2">
      MISSION RESOURCES
    </text>

    <text x="160" y="62" fill="#1e3a5f" font-size="11" font-weight="600" text-anchor="middle">
      Resources gated by agentic JWTs
    </text>

    <g transform="translate(20, 85)">
      <rect width="280" height="46" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5" rx="4"/>
      <text x="25" y="29" font-size="20">📁</text>
      <text x="55" y="22" fill="#1b5e20" font-size="12" font-weight="700">Code repositories</text>
      <text x="55" y="38" fill="#555" font-size="10">read:repo, write:repo, create:pr</text>
    </g>

    <g transform="translate(20, 140)">
      <rect width="280" height="46" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5" rx="4"/>
      <text x="25" y="29" font-size="20">⚙</text>
      <text x="55" y="22" fill="#1b5e20" font-size="12" font-weight="700">Mission systems / APIs</text>
      <text x="55" y="38" fill="#555" font-size="10">domain operations, mission data</text>
    </g>

    <g transform="translate(20, 195)">
      <rect width="280" height="46" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5" rx="4"/>
      <text x="25" y="29" font-size="20">🚀</text>
      <text x="55" y="22" fill="#1b5e20" font-size="12" font-weight="700">Deployment / orchestration</text>
      <text x="55" y="38" fill="#555" font-size="10">deploy:production, write:config</text>
    </g>

    <g transform="translate(20, 250)">
      <rect width="280" height="46" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5" rx="4"/>
      <text x="25" y="29" font-size="20">🔒</text>
      <text x="55" y="22" fill="#1b5e20" font-size="12" font-weight="700">Sensitive data stores</text>
      <text x="55" y="38" fill="#555" font-size="10">read:classified, payment:initiate</text>
    </g>

    <g transform="translate(20, 320)">
      <rect width="280" height="92" fill="#f8f9fa" stroke="#cfd8e3" stroke-width="1" rx="4"/>
      <text x="14" y="22" fill="#1e3a5f" font-size="11" font-weight="700">RESOURCE-SIDE ENFORCEMENT</text>
      <text x="14" y="42" fill="#444" font-size="10.5">Resources verify the JWT signature</text>
      <text x="14" y="56" fill="#444" font-size="10.5">AND the per-request PoP signature</text>
      <text x="14" y="70" fill="#444" font-size="10.5">before serving any operation.</text>
      <text x="14" y="86" fill="#888" font-size="10" font-style="italic">Compromised tokens cannot be reused.</text>
    </g>
  </g>

  <!-- ============ FLOW ARROWS ============ -->
  <!-- Agent → IDP -->
  <g>
    <path d="M 380 350 L 420 350" stroke="#1e3a5f" stroke-width="2" fill="none" marker-end="url(#arr-blue)"/>
    <text x="400" y="343" fill="#1e3a5f" font-size="9" text-anchor="middle" font-weight="600">register</text>
    <text x="400" y="360" fill="#1e3a5f" font-size="9" text-anchor="middle">+ mint</text>
  </g>
  <!-- IDP → Agent (token back) -->
  <g>
    <path d="M 420 410 L 380 410" stroke="#2e7d32" stroke-width="2" fill="none" marker-end="url(#arr-green)"/>
    <text x="400" y="403" fill="#2e7d32" font-size="9" text-anchor="middle" font-weight="600">intent</text>
    <text x="400" y="420" fill="#2e7d32" font-size="9" text-anchor="middle">token</text>
  </g>

  <!-- Agent → Resources (signed request) -->
  <g>
    <path d="M 380 530 C 700 530, 700 580, 1020 540" stroke="#2e7d32" stroke-width="2" fill="none" marker-end="url(#arr-green)" stroke-dasharray="6,3"/>
    <text x="700" y="523" fill="#2e7d32" font-size="10" text-anchor="middle" font-weight="600">Signed request (Bearer + PoP signature)</text>
  </g>

  <!-- Threat blocked arrows -->
  <g>
    <path d="M 260 230 L 470 290" stroke="#c9302c" stroke-width="2" fill="none" stroke-dasharray="4,3"/>
    <text x="362" y="252" fill="#c9302c" font-size="9" font-weight="700" text-anchor="middle" transform="rotate(15, 362, 252)">blocked at A2</text>
  </g>
  <g>
    <path d="M 700 230 L 700 290" stroke="#c9302c" stroke-width="2" fill="none" stroke-dasharray="4,3"/>
    <text x="720" y="262" fill="#c9302c" font-size="9" font-weight="700">blocked at A8</text>
  </g>
  <g>
    <path d="M 1140 230 L 935 290" stroke="#c9302c" stroke-width="2" fill="none" stroke-dasharray="4,3"/>
    <text x="1037" y="252" fill="#c9302c" font-size="9" font-weight="700" text-anchor="middle" transform="rotate(-15, 1037, 252)">blocked at A6</text>
  </g>

  <!-- ============ BOTTOM STRIP: SCENARIOS + EVIDENCE ============ -->
  <g transform="translate(60, 715)">
    <rect width="1280" height="125" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.5" rx="8"/>

    <!-- Header -->
    <rect width="1280" height="32" fill="#1e3a5f" rx="8"/>
    <rect y="24" width="1280" height="8" fill="#1e3a5f"/>
    <text x="640" y="22" fill="white" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="3">
      OPERATIONAL SCENARIOS &amp; EVIDENCE
    </text>

    <!-- Scenarios -->
    <g transform="translate(20, 50)">
      <text fill="#1e3a5f" font-size="11" font-weight="700">REPRESENTATIVE SCENARIOS</text>
      <text y="20" fill="#444" font-size="10.5">• Coalition agentic SOC operations across security domains</text>
      <text y="36" fill="#444" font-size="10.5">• Autonomous mission-system patching by agent fleets</text>
      <text y="52" fill="#444" font-size="10.5">• Cross-domain agent collaboration with provable identity</text>
      <text y="68" fill="#444" font-size="10.5">• Agentic incident-response with delegated, scoped authority</text>
    </g>

    <!-- Live evidence -->
    <g transform="translate(490, 50)">
      <text fill="#1e3a5f" font-size="11" font-weight="700">LIVE REFERENCE IMPLEMENTATION</text>
      <text y="20" fill="#444" font-size="10.5">Demo:  https://demo.unforge.io</text>
      <text y="36" fill="#444" font-size="10.5">IDP:   https://idp.unforge.io</text>
      <text y="52" fill="#444" font-size="10.5">API:   https://api.unforge.io</text>
      <text y="68" fill="#444" font-size="10.5" font-style="italic">Public OIDC discovery + JWKS · interop-tested at IIW April 2026</text>
    </g>

    <!-- Result matrix -->
    <g transform="translate(960, 50)">
      <text fill="#1e3a5f" font-size="11" font-weight="700">HEADLINE RESULT</text>
      <g transform="translate(0, 12)">
        <rect width="280" height="68" fill="#fff5f5" stroke="#d9534f" stroke-width="1" rx="4"/>
        <text x="14" y="20" fill="#c9302c" font-size="11" font-weight="700">OAuth (legacy):</text>
        <text x="140" y="20" fill="#c9302c" font-size="14" font-weight="700">3 / 3 attacks succeeded</text>
        <line x1="14" y1="32" x2="266" y2="32" stroke="#cfd8e3"/>
        <text x="14" y="48" fill="#1b5e20" font-size="11" font-weight="700">Agentic JWT:</text>
        <text x="140" y="48" fill="#1b5e20" font-size="14" font-weight="700">3 / 3 attacks blocked</text>
        <text x="14" y="62" fill="#666" font-size="9" font-style="italic">Captured run, 2026-04-27 · reproducible</text>
      </g>
    </g>
  </g>

  <!-- Footer note -->
  <text x="700" y="880" fill="#888" font-size="9" text-anchor="middle" font-style="italic">
    Patchet · OV-1 · v0.1 · For DoD coordination · github.com/&lt;repo&gt; · IETF: draft-goswami-agentic-jwt-00
  </text>

</svg>
